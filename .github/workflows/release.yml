name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version, for example 0.2.0
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update version and changelog
        run: npm run release:tag -- ${{ inputs.version }}
      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json CHANGELOG.md
          git commit -m "chore: release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD
          git push origin "v${{ inputs.version }}"

  verify-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify changelog entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "## \[${VERSION}\]" CHANGELOG.md

  publish-tauri:
    if: github.event_name == 'push'
    needs: verify-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: npm ci
      - name: Build release notes
        id: release_notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const marker = `## [${version}]`;
          const startIndex = changelog.indexOf(marker);
          const fallback = 'See CHANGELOG.md for release notes.';
          let body = fallback;

          if (startIndex >= 0) {
            const afterStart = changelog.slice(startIndex);
            const nextSection = afterStart.slice(marker.length).match(/\n## \[/);
            body = (nextSection
              ? afterStart.slice(0, marker.length + nextSection.index)
              : afterStart).trim();
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<GITIO_RELEASE_NOTES\n${body}\nGITIO_RELEASE_NOTES\n`);
          NODE
      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gitio ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - name: Sync GitHub release body
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.release_notes.outputs.body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = process.env.RELEASE_BODY || '';
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              tag_name: tag,
              name: `Gitio ${tag}`,
              body,
              draft: false,
              prerelease: false,
            });
